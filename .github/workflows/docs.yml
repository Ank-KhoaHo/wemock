name: docs

# Publishes the documentation site, built from guide/, to GitHub Pages. It starts when the
# release workflow has finished SUCCESSFULLY, not on the tag itself, so the site never
# describes a version whose release failed. The site then matches what users can install.
#
# GitHub Pages must be switched on once, by hand: Settings > Pages > Source > GitHub Actions.
#
# workflow_run fires from this file as it stands on the default branch when the release
# finishes, so it cannot fire for a release made before the file existed. The manual button
# (workflow_dispatch) is for that first deploy, and for a fix to the guide alone.

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned by commit hash, as in every workflow here; tests/test_workflows.py holds it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the site
        run: npm run docs:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: guide/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
