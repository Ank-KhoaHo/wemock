<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Early Fetch</title>
  <script>
    fetch('/api/goals')
      .then(function(res) { return res.text(); })
      .then(function(text) {
        var el = document.getElementById('out');
        if (el) {
          el.textContent = text;
        } else {
          window.__earlyResult = text;
        }
      })
      .catch(function(err) {
        var el = document.getElementById('out');
        if (el) {
          el.textContent = 'ERR: ' + (err && err.message ? err.message : String(err));
        } else {
          window.__earlyResult = 'ERR: ' + (err && err.message ? err.message : String(err));
        }
      });
  </script>
</head>
<body>
  <div id="out"></div>
  <script>
    if (window.__earlyResult) {
      document.getElementById('out').textContent = window.__earlyResult;
    }
  </script>
</body>
</html>
